format = 2

[effect]
id = "concat.word-blur-roll-out"
name = "Word Blur Roll Out"
kind = "effect"
category = "Motion"
order = 430
description = "Each word rolls away, turning once as it glides off to the left, while blurring away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
