format = 2

[effect]
id = "concat.word-blur-wave-in"
name = "Word Blur Wave In"
kind = "effect"
category = "Motion"
order = 415
description = "Each word ripples into place like a wave travelling across the picture, while sharpening out of a soft blur, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
