format = 2

[effect]
id = "concat.epic"
name = "Epic"
kind = "filter"
category = "Cinematic"
order = 66
intensity = "tone"
description = "An epic on the big screen: warm light, deep shadows, a story larger than life."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "scale"
label = "Scale"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
