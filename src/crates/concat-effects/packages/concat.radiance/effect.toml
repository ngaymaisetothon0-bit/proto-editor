format = 2

[effect]
id = "concat.radiance"
name = "Radiance"
kind = "filter"
category = "Portrait"
order = 86
intensity = "tone"
description = "Radiance on a face: warm, bright, glowing — light that comes from within."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "warm"
label = "Warm"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
