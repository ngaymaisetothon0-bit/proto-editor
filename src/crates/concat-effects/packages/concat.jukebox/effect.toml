format = 2

[effect]
id = "concat.jukebox"
name = "Jukebox"
kind = "filter"
category = "Retro"
order = 71
intensity = "tone"
description = "A jukebox glow: warm retro neon, film grain of the old days, songs on vinyl."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "neon"
label = "Neon"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
