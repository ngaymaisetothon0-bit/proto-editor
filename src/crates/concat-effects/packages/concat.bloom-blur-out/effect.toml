format = 2

[effect]
id = "concat.bloom-blur-out"
name = "Bloom Blur Out"
kind = "effect"
category = "Motion"
order = 243
description = "The clip blooms out through a blur, flaring bright as it softens over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
