format = 2

[effect]
id = "concat.tumble-blur-out"
name = "Tumble Blur Out"
kind = "effect"
category = "Motion"
order = 220
description = "The clip tumbles out through a blur, turning end over end as it softens over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
