format = 2

[effect]
id = "concat.word-blur-elastic-in"
name = "Word Blur Elastic In"
kind = "effect"
category = "Motion"
order = 234
description = "Each word wobbles elastically into place, growing from 60% with a rubber-band overshoot, while sharpening out of a soft blur, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
