format = 2

[effect]
id = "concat.word-blur-slide-out"
name = "Word Blur Slide Out"
kind = "effect"
category = "Motion"
order = 167
description = "Each word slides up and blurs away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
