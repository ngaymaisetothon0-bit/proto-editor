format = 2

[effect]
id = "concat.glitch-out"
name = "Glitch Out"
kind = "effect"
category = "Motion"
order = 65
description = "The clip glitches out, its picture sliced into bands that jump sideways as it fades over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
