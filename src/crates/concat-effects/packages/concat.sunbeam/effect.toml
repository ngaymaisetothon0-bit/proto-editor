format = 2

[effect]
id = "concat.sunbeam"
name = "Sunbeam"
kind = "filter"
category = "Light"
order = 74
intensity = "tone"
description = "A shaft of sunlight: warm, bright, lifted like morning through a window."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "beam"
label = "Beam"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
