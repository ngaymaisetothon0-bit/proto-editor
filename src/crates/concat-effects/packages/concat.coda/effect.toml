format = 2

[effect]
id = "concat.coda"
name = "Coda"
kind = "filter"
category = "Cinematic"
order = 65
intensity = "tone"
description = "The coda of a long film: warm light fading, cool shadows closing, the end done right."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "ending"
label = "Ending"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
