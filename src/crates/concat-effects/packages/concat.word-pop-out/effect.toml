format = 2

[effect]
id = "concat.word-pop-out"
name = "Word Pop Out"
kind = "effect"
category = "Motion"
order = 25
description = "Each word shrinks away and fades out, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
