format = 2

[effect]
id = "concat.terrace"
name = "Terrace"
kind = "filter"
category = "Everyday"
order = 32
intensity = "tone"
description = "Coffee on the terrace in the morning: plain, warm, unhurried — an ordinary good day."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "morning"
label = "Morning"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
