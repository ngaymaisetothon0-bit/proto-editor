format = 2

[effect]
id = "concat.word-slide-in"
name = "Word Slide In"
kind = "effect"
category = "Motion"
order = 14
description = "Each word rises into place from below and fades in, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
