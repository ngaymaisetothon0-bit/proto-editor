format = 2

[effect]
id = "concat.prism"
name = "Prism"
kind = "filter"
category = "Color"
order = 36
intensity = "tone"
description = "Light through a prism: hues gently turned, colour richer, the picture bending toward the rainbow."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "shift"
label = "Shift"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
