format = 2

[effect]
id = "concat.village"
name = "Village"
kind = "filter"
category = "Everyday"
order = 43
intensity = "tone"
description = "A village in the afternoon: plain, warm, quiet — an ordinary good day."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "afternoon"
label = "Afternoon"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
