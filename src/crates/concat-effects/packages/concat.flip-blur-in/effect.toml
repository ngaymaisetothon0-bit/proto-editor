format = 2

[effect]
id = "concat.flip-blur-in"
name = "Flip Blur In"
kind = "effect"
category = "Motion"
order = 192
description = "The clip flips in through a blur, turning around its flat axis as it sharpens over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
