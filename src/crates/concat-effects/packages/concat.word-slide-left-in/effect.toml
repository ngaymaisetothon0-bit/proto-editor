format = 2

[effect]
id = "concat.word-slide-left-in"
name = "Word Slide Left In"
kind = "effect"
category = "Motion"
order = 40
description = "Each word slides into place from the left and fades in, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
