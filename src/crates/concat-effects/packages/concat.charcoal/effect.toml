format = 2

[effect]
id = "concat.charcoal"
name = "Charcoal"
kind = "filter"
category = "Black & White"
order = 77
intensity = "tone"
description = "Soft black and white: lifted blacks, gentle contrast, no harsh clip."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "lift"
label = "Lift"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
