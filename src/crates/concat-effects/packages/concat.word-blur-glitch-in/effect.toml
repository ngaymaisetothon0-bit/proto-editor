format = 2

[effect]
id = "concat.word-blur-glitch-in"
name = "Word Blur Glitch In"
kind = "effect"
category = "Motion"
order = 431
description = "Each word glitches into place, jittering sideways as it sharpens out of a soft blur, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
