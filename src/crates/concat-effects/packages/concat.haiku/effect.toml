format = 2

[effect]
id = "concat.haiku"
name = "Haiku"
kind = "filter"
category = "Cinematic"
order = 78
intensity = "tone"
description = "A haiku on the big screen: warm light, deep shadows, seventeen syllables of light."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "syllables"
label = "Syllables"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
