format = 2

[effect]
id = "concat.word-slide-up-out"
name = "Word Slide Up Out"
kind = "effect"
category = "Motion"
order = 53
description = "Each word rises away above and fades out, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
