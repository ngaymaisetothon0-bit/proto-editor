format = 2

[effect]
id = "concat.flicker"
name = "Flicker"
kind = "transition"
category = "Basic"
order = 3
description = "The old shot flickers like a dying bulb, then the cut snaps to the new one."

[[param]]
key = "speed"
label = "Speed"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
