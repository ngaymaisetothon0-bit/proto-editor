format = 2

[effect]
id = "concat.text-blur-zoom-in"
name = "Text Blur Zoom In"
kind = "effect"
category = "Motion"
order = 174
description = "The whole title zooms in from 150% while sharpening out of a soft blur over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
