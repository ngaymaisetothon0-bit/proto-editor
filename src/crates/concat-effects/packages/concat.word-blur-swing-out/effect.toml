format = 2

[effect]
id = "concat.word-blur-swing-out"
name = "Word Blur Swing Out"
kind = "effect"
category = "Motion"
order = 420
description = "Each word swings away like a pendulum rocking around the picture centre, while blurring away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
