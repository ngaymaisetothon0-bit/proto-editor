format = 2

[effect]
id = "concat.tale"
name = "Tale"
kind = "filter"
category = "Cinematic"
order = 73
intensity = "tone"
description = "A tale on the big screen: warm light, deep shadows, a story told by firelight."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "firelight"
label = "Firelight"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
