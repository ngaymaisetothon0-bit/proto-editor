format = 2

[effect]
id = "concat.wisp"
name = "Wisp"
kind = "filter"
category = "Light"
order = 81
intensity = "tone"
description = "A wisp of light in the dark: faint, drifting, barely there — and beautiful."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "drift"
label = "Drift"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
