format = 2

[effect]
id = "concat.slide-left"
name = "Slide Left"
kind = "transition"
category = "Slide"
order = 12
description = "The new shot slides in from the left, pushing the old one off the right."

[[param]]
key = "distance"
label = "Distance"
min = 50
max = 150
default = 100
step = 5
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
