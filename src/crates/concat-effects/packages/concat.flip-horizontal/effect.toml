format = 2

[effect]
id = "concat.flip-horizontal"
name = "Flip Horizontal"
kind = "transition"
category = "Spin"
order = 9
description = "The frame flips like a card around its vertical axis, shaded at the turn."

[[param]]
key = "shade"
label = "Shade"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
