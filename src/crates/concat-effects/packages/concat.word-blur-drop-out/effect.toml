format = 2

[effect]
id = "concat.word-blur-drop-out"
name = "Word Blur Drop Out"
kind = "effect"
category = "Motion"
order = 342
description = "Each word drops away, falling a full frame height, while blurring away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
