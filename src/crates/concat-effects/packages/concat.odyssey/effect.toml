format = 2

[effect]
id = "concat.odyssey"
name = "Odyssey"
kind = "filter"
category = "Cinematic"
order = 70
intensity = "tone"
description = "An odyssey on the big screen: warm light, deep shadows, a long journey home."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "journey"
label = "Journey"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
