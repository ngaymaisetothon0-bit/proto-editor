# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. The middle pixel is 0.25 from the centre in diamond distance,
# so it is through at half the cut whatever the softness.

[[probe]]
name = "default"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.5
expect = [0.04999, 0.15002, 0.3999, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.5
expect = [0.04999, 0.15002, 0.3999, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.5
expect = [0.06201, 0.15564, 0.39819, 1]
