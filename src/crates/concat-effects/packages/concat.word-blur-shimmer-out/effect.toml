format = 2

[effect]
id = "concat.word-blur-shimmer-out"
name = "Word Blur Shimmer Out"
kind = "effect"
category = "Motion"
order = 418
description = "Each word shimmers away, its brightness rippling as it blurs away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
