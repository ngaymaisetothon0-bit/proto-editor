format = 2

[effect]
id = "concat.serenade"
name = "Serenade"
kind = "filter"
category = "Portrait"
order = 92
intensity = "tone"
description = "Serenade on a face: warm, soft, sweet — a song you can see."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "warm"
label = "Warm"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
