format = 2

[effect]
id = "concat.slide-out-up"
name = "Slide Out Up"
kind = "effect"
category = "Motion"
order = 21
description = "The clip slides up out of the frame over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
