format = 2

[effect]
id = "concat.spark"
name = "Spark"
kind = "filter"
category = "Light"
order = 80
intensity = "tone"
description = "A spark in the dark: one small bright point, warm and alive."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "flash"
label = "Flash"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
