format = 2

[effect]
id = "concat.ink"
name = "Ink"
kind = "filter"
category = "Black & White"
order = 82
intensity = "tone"
description = "Deep black ink: black and white with bite, dark blacks, crisp whites, like a fresh print."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 75
step = 1
unit = "%"

[[param]]
key = "deep"
label = "Deep"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
