format = 2

[effect]
id = "concat.word-blur-spring-in"
name = "Word Blur Spring In"
kind = "effect"
category = "Motion"
order = 214
description = "Each word springs in from 60% with a bounce while sharpening out of a soft blur, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
