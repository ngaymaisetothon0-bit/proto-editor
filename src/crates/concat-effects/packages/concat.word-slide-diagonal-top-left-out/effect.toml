format = 2

[effect]
id = "concat.word-slide-diagonal-top-left-out"
name = "Word Slide Diagonal Top Left Out"
kind = "effect"
category = "Motion"
order = 97
description = "Each word slides away to the top left and fades out, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
