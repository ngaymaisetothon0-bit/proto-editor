format = 2

[effect]
id = "concat.text-slide-right-in"
name = "Text Slide Right In"
kind = "effect"
category = "Motion"
order = 80
description = "The whole title slides into place from the right and fades in over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
