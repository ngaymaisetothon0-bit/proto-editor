format = 2

[effect]
id = "concat.tumble-in"
name = "Tumble In"
kind = "effect"
category = "Motion"
order = 90
description = "The clip tumbles in, turning end over end as it drops into place over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
