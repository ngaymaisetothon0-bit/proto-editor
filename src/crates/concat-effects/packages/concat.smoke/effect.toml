format = 2

[effect]
id = "concat.smoke"
name = "Smoke"
kind = "filter"
category = "Black & White"
order = 86
intensity = "tone"
description = "Smoke curling through grey air: black and white, hazy and soft, like an old film."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "haze"
label = "Haze"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
