format = 2

[effect]
id = "concat.silver-light"
name = "Silver Light"
kind = "filter"
category = "Light"
order = 94
intensity = "tone"
description = "Silver light on a cold day: bright, cool, clear — moonlight in the morning."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "moon"
label = "Moon"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
