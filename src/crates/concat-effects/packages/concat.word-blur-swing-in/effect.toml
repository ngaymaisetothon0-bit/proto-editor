format = 2

[effect]
id = "concat.word-blur-swing-in"
name = "Word Blur Swing In"
kind = "effect"
category = "Motion"
order = 419
description = "Each word swings into place like a pendulum rocking around the picture centre, while sharpening out of a soft blur, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
