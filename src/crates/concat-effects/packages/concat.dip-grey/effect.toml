format = 2

[effect]
id = "concat.dip-grey"
name = "Dip to Grey"
kind = "transition"
category = "Basic"
order = 9
description = "The cut dips through neutral grey, like an old film splice."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
