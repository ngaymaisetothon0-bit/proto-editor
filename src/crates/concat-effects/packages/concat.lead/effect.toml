format = 2

[effect]
id = "concat.lead"
name = "Lead"
kind = "filter"
category = "Black & White"
order = 98
intensity = "tone"
description = "Lead, heavy and grey: black and white, soft and dull, like old type."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "weight"
label = "Weight"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
