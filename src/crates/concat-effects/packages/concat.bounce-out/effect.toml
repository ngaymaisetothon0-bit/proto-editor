format = 2

[effect]
id = "concat.bounce-out"
name = "Bounce Out"
kind = "effect"
category = "Motion"
order = 63
description = "The clip bounces out, swelling up a little first, then shrinking away over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
