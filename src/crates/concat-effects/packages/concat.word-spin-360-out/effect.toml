format = 2

[effect]
id = "concat.word-spin-360-out"
name = "Word Spin 360 Out"
kind = "effect"
category = "Motion"
order = 211
description = "Each word makes one full 360-degree turn while fading out, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
