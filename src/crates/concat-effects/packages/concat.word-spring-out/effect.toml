format = 2

[effect]
id = "concat.word-spring-out"
name = "Word Spring Out"
kind = "effect"
category = "Motion"
order = 149
description = "Each word springs away, shrinking to 60% with a bounce, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
