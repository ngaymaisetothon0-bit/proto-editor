format = 2

[effect]
id = "concat.word-blur-flip-out"
name = "Word Blur Flip Out"
kind = "effect"
category = "Motion"
order = 340
description = "Each word flips away like a card turning around its flat axis, while blurring away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
