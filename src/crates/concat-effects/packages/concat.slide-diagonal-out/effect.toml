format = 2

[effect]
id = "concat.slide-diagonal-out"
name = "Slide Diagonal Out"
kind = "transition"
category = "Slide"
order = 17
description = "The old shot slides off diagonally, the new one underneath."

[[param]]
key = "distance"
label = "Distance"
min = 50
max = 150
default = 100
step = 5
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
