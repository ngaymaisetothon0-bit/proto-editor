format = 2

[effect]
id = "concat.soot"
name = "Soot"
kind = "filter"
category = "Black & White"
order = 85
intensity = "tone"
description = "Soot on the wall: black and white, dark and smoky, like a chimney sweep's sketch."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "smoke"
label = "Smoke"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
