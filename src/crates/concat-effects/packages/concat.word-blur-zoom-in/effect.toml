format = 2

[effect]
id = "concat.word-blur-zoom-in"
name = "Word Blur Zoom In"
kind = "effect"
category = "Motion"
order = 176
description = "Each word zooms in from 150% while sharpening out of a soft blur, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
