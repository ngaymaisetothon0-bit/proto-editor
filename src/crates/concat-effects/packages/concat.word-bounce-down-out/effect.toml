format = 2

[effect]
id = "concat.word-bounce-down-out"
name = "Word Bounce Down Out"
kind = "effect"
category = "Motion"
order = 155
description = "Each word bounces downward and away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
