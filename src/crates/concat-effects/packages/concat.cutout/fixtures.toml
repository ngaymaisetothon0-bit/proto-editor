# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. Pinned by running the display-space pipeline over the
# shader maths, so the look is what it was.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.33936, 0.20825, 0.1095, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.45, 0.4, 0.35, 1]
expect = [0.44995, 0.3999, 0.3501, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.08, 0.07, 0.06, 1]
expect = [0.08356, 0.06982, 0.05646, 1]
