format = 2

[effect]
id = "concat.zoom-ripple"
name = "Zoom Ripple"
kind = "transition"
category = "Zoom"
order = 35
description = "The camera zooms and ripples into the new shot."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
