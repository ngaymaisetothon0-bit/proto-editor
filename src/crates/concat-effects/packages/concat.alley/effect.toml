format = 2

[effect]
id = "concat.alley"
name = "Alley"
kind = "filter"
category = "Everyday"
order = 40
intensity = "tone"
description = "A quiet alley in the morning: plain, warm, hidden — an ordinary good day."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "morning"
label = "Morning"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
