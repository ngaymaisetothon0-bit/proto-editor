format = 2

[effect]
id = "concat.slide-down-in"
name = "Slide Down In"
kind = "transition"
category = "Slide"
order = 28
description = "The new shot slides in from the top, pushing the old one down."

[[param]]
key = "distance"
label = "Distance"
min = 50
max = 150
default = 100
step = 5
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
