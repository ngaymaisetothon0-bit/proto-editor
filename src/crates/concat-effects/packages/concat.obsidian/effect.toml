format = 2

[effect]
id = "concat.obsidian"
name = "Obsidian"
kind = "filter"
category = "Black & White"
order = 89
intensity = "tone"
description = "Obsidian, black volcanic glass: black and white, sharp and dark, like a mirror of stone."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "glass"
label = "Glass"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
