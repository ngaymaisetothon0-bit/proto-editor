format = 2

[effect]
id = "concat.western"
name = "Western"
kind = "filter"
category = "Cinematic"
order = 54
intensity = "tone"
description = "Dusty western sun: warm browns, faded film, high noon on the frontier."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "dust"
label = "Dust"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
