format = 2

[effect]
id = "concat.word-blur-pop-out"
name = "Word Blur Pop Out"
kind = "effect"
category = "Motion"
order = 191
description = "Each word pops out to 60% while blurring away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
