format = 2

[effect]
id = "concat.tin"
name = "Tin"
kind = "filter"
category = "Black & White"
order = 99
intensity = "tone"
description = "Tin, dull and grey: black and white, soft and flat, like old roof."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "roof"
label = "Roof"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
