format = 2

[effect]
id = "concat.shake-in"
name = "Shake In"
kind = "effect"
category = "Motion"
order = 32
description = "The clip shakes hard and settles into place, fading up, over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
