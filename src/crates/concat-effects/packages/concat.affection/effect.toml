format = 2

[effect]
id = "concat.affection"
name = "Affection"
kind = "filter"
category = "Portrait"
order = 95
intensity = "tone"
description = "Affection on a face: warm, soft, kind — a look that stays with you."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "warm"
label = "Warm"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
