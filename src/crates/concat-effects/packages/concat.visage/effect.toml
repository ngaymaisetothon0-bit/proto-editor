format = 2

[effect]
id = "concat.visage"
name = "Visage"
kind = "filter"
category = "Portrait"
order = 83
intensity = "tone"
description = "A visage in soft light: warm, clear, honest — the face itself, nothing else."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "warm"
label = "Warm"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
