format = 2

[effect]
id = "concat.tangerine"
name = "Tangerine"
kind = "filter"
category = "Color"
order = 38
intensity = "tone"
description = "Bright tangerine colour: juicy orange warmth, sunny and bold."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "juice"
label = "Juice"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
