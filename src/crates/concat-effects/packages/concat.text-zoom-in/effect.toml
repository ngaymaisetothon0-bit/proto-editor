format = 2

[effect]
id = "concat.text-zoom-in"
name = "Text Zoom In"
kind = "effect"
category = "Motion"
order = 70
description = "The whole title settles into place from larger and fainter over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
