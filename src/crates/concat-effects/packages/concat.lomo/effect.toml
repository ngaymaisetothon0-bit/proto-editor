format = 2

[effect]
id = "concat.lomo"
name = "Lomo"
kind = "filter"
category = "Retro"
order = 69
intensity = "tone"
description = "The toy camera: saturated, punchy, and the corners pulled dark."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 35
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
