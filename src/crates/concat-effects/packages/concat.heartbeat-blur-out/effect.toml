format = 2

[effect]
id = "concat.heartbeat-blur-out"
name = "Heartbeat Blur Out"
kind = "effect"
category = "Motion"
order = 250
description = "The clip beats out through a blur, pulsing twice like a heartbeat as it softens over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
