format = 2

[effect]
id = "concat.dusk"
name = "Dusk"
kind = "filter"
category = "Cinematic"
order = 56
intensity = "tone"
description = "Blue hour after sunset: deep blue shadows, warm embers in the light, quiet and cinematic."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "blue"
label = "Blue"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
