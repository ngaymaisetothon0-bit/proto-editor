format = 2

[effect]
id = "concat.zoom-pulse-out"
name = "Zoom Pulse Out"
kind = "transition"
category = "Zoom"
order = 30
description = "The camera zooms out and pulses into the new shot."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
