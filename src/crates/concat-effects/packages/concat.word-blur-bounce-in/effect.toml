format = 2

[effect]
id = "concat.word-blur-bounce-in"
name = "Word Blur Bounce In"
kind = "effect"
category = "Motion"
order = 285
description = "Each word bounces into place, growing from 60% in a series of smaller bounces, while sharpening out of a soft blur, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
