format = 2

[effect]
id = "concat.text-wipe-top-left-out"
name = "Text Wipe Top Left Out"
kind = "effect"
category = "Motion"
order = 127
description = "The whole title wipes away from the top-left corner over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
