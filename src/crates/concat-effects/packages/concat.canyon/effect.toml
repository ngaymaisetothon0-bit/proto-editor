format = 2

[effect]
id = "concat.canyon"
name = "Canyon"
kind = "filter"
category = "Scenery"
order = 83
intensity = "tone"
description = "Red rock canyon at noon: warm stone, deep shadows, the desert glowing."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "rock"
label = "Rock"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
