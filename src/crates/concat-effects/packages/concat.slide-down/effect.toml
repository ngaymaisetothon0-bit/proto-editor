format = 2

[effect]
id = "concat.slide-down"
name = "Slide Down"
kind = "transition"
category = "Slide"
order = 11
description = "The new shot slides down from above, pushing the old one off the bottom."

[[param]]
key = "distance"
label = "Distance"
min = 50
max = 150
default = 100
step = 5
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
