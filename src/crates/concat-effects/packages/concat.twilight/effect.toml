format = 2

[effect]
id = "concat.twilight"
name = "Twilight"
kind = "filter"
category = "Cinematic"
order = 39
intensity = "tone"
description = "Dusk in a look: violet shadows, amber highlights, and a held-back midtone, so evening footage reads as evening."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 75
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
