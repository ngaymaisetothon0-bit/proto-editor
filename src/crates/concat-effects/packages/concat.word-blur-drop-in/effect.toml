format = 2

[effect]
id = "concat.word-blur-drop-in"
name = "Word Blur Drop In"
kind = "effect"
category = "Motion"
order = 341
description = "Each word drops into place from above, falling a full frame height, while sharpening out of a soft blur, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
