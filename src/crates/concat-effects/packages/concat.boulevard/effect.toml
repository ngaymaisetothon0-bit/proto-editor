format = 2

[effect]
id = "concat.boulevard"
name = "Boulevard"
kind = "filter"
category = "Everyday"
order = 34
intensity = "tone"
description = "Strolling the boulevard in the afternoon: plain, bright, easy — an ordinary good day."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "afternoon"
label = "Afternoon"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
