format = 2

[effect]
id = "concat.grow-blur-out"
name = "Grow Blur Out"
kind = "effect"
category = "Motion"
order = 233
description = "The clip shrinks out through a blur, collapsing small as it softens over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
