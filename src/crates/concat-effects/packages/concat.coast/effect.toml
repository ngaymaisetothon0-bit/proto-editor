format = 2

[effect]
id = "concat.coast"
name = "Coast"
kind = "filter"
category = "Scenery"
order = 82
intensity = "tone"
description = "Sea air on the coast: cool blues and fresh greens lifted, crisp light like a walk by the water."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "breeze"
label = "Breeze"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
