format = 2

[effect]
id = "concat.ruby"
name = "Ruby"
kind = "filter"
category = "Color"
order = 46
intensity = "tone"
description = "Ruby stone: deep red, warm and precious, a gem colour."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "gem"
label = "Gem"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
