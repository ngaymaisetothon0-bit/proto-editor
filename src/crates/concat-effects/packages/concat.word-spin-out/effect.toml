format = 2

[effect]
id = "concat.word-spin-out"
name = "Word Spin Out"
kind = "effect"
category = "Motion"
order = 187
description = "Each word rotates out to +90 degrees, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
