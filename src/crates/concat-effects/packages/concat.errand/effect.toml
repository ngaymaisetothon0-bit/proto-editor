format = 2

[effect]
id = "concat.errand"
name = "Errand"
kind = "filter"
category = "Everyday"
order = 28
intensity = "tone"
description = "Running errands in daylight: plain, bright, honest — an ordinary good day."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "day"
label = "Day"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
