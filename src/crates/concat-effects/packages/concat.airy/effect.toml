format = 2

[effect]
id = "concat.airy"
name = "Airy"
kind = "filter"
category = "Light"
order = 72
intensity = "tone"
description = "Bright and soft: shadows lifted, contrast eased, a breath of cool air."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
