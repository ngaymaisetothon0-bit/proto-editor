format = 2

[effect]
id = "concat.frost"
name = "Frost"
kind = "filter"
category = "Scenery"
order = 61
intensity = "tone"
description = "A cold morning: paler, flatter, the air itself in the picture."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
