format = 2

[effect]
id = "concat.courtyard"
name = "Courtyard"
kind = "filter"
category = "Everyday"
order = 37
intensity = "tone"
description = "Morning in the courtyard: plain, warm, quiet — an ordinary good day."

[[param]]
key = "tone"
