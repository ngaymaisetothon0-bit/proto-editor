format = 2

[effect]
id = "concat.carbon"
name = "Carbon"
kind = "filter"
category = "Black & White"
order = 93
intensity = "tone"
description = "Carbon, black and hard: black and white, deep and sharp, like a pencil pressed hard."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "press"
label = "Press"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
