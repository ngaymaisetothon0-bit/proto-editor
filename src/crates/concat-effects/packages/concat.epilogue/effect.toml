format = 2

[effect]
id = "concat.epilogue"
name = "Epilogue"
kind = "filter"
category = "Cinematic"
order = 62
intensity = "tone"
description = "The epilogue of a long film: warm shadows, cool light, the story closing gently."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "close"
label = "Close"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
