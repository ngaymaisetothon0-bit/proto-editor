format = 2

[effect]
id = "concat.word-overshoot-out"
name = "Word Overshoot Out"
kind = "effect"
category = "Motion"
order = 153
description = "Each word overshoots out, shrinking past 60% once and away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
