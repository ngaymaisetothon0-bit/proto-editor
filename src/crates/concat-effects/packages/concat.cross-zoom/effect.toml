format = 2

[effect]
id = "concat.cross-zoom"
name = "Cross Zoom"
kind = "transition"
category = "Zoom"
order = 16
description = "Both shots rush through the lens at once: the outgoing zooms in as the incoming zooms out."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
