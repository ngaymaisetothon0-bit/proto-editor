format = 2

[effect]
id = "concat.stretch-blur-out"
name = "Stretch Blur Out"
kind = "effect"
category = "Motion"
order = 209
description = "The clip squashes out through a blur, flattening as it softens over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
