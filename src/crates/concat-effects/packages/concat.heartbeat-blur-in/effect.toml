format = 2

[effect]
id = "concat.heartbeat-blur-in"
name = "Heartbeat Blur In"
kind = "effect"
category = "Motion"
order = 247
description = "The clip beats in through a blur, pulsing twice like a heartbeat as it sharpens over the first half-second."

[[param]]
key = "duration"
label = "Duration"
