format = 2

[effect]
id = "concat.street-food"
name = "Street Food"
kind = "filter"
category = "Food"
order = 74
intensity = "tone"
description = "Street food at noon: warm, vivid, a little extra contrast so the food pops."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
