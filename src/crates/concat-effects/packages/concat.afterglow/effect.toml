format = 2

[effect]
id = "concat.afterglow"
name = "Afterglow"
kind = "filter"
category = "Cinematic"
order = 60
intensity = "tone"
description = "The glow after sunset: warm embers below, cool dusk above — the day's last light."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "ember"
label = "Ember"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
