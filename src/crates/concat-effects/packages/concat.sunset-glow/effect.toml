format = 2

[effect]
id = "concat.sunset-glow"
name = "Sunset Glow"
kind = "filter"
category = "Vibe"
order = 80
intensity = "tone"
description = "Golden hour bottled: orange shadows, pink highlights, warm and soft."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
