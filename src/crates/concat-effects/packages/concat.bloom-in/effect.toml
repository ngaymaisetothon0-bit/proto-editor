format = 2

[effect]
id = "concat.bloom-in"
name = "Bloom In"
kind = "effect"
category = "Motion"
order = 116
description = "The clip blooms in, its brightness rising from dark to full over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
