format = 2

[effect]
id = "concat.moonlight"
name = "Moonlight"
kind = "filter"
category = "Cinematic"
order = 40
intensity = "tone"
description = "Night lit by the moon: cooler, quieter, the shadows gone blue."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
