format = 2

[effect]
id = "concat.ripple-out"
name = "Ripple Out"
kind = "effect"
category = "Motion"
order = 75
description = "The clip ripples out, a spreading wave growing over the picture as it fades over its last half-second."

[[param]]
key = "duration"
