format = 2

[effect]
id = "concat.myth"
name = "Myth"
kind = "filter"
category = "Cinematic"
order = 71
intensity = "tone"
description = "A myth on the big screen: warm light, deep shadows, a story older than memory."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "story"
label = "Story"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
