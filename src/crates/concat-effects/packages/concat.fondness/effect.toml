format = 2

[effect]
id = "concat.fondness"
name = "Fondness"
kind = "filter"
category = "Portrait"
order = 96
intensity = "tone"
description = "Fondness on a face: warm, soft, gentle — a look that remembers."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "warm"
label = "Warm"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
