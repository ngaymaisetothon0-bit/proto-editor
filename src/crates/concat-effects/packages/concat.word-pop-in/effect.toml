format = 2

[effect]
id = "concat.word-pop-in"
name = "Word Pop In"
kind = "effect"
category = "Motion"
order = 15
description = "Each word pops into place from smaller and fainter, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
