format = 2

[effect]
id = "concat.garden"
name = "Garden"
kind = "filter"
category = "Everyday"
order = 23
intensity = "tone"
description = "A garden in daylight: fresh greens lifted, soft sun, everything a little more alive."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "fresh"
label = "Fresh"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
