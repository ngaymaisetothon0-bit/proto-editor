format = 2

[effect]
id = "concat.text-slide-left-in"
name = "Text Slide Left In"
kind = "effect"
category = "Motion"
order = 68
description = "The whole title slides into place from the left and fades in over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
