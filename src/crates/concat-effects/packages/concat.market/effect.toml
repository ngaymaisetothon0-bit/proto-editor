format = 2

[effect]
id = "concat.market"
name = "Market"
kind = "filter"
category = "Everyday"
order = 35
intensity = "tone"
description = "Morning at the market: plain, bright, busy — an ordinary good day."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "morning"
label = "Morning"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
