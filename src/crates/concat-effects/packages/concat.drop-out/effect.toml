format = 2

[effect]
id = "concat.drop-out"
name = "Drop Out"
kind = "effect"
category = "Motion"
order = 45
description = "The clip drops out below the frame like a falling card, speeding up as it leaves over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
