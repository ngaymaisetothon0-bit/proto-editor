format = 2

[effect]
id = "concat.word-blur-overshoot-out"
name = "Word Blur Overshoot Out"
kind = "effect"
category = "Motion"
order = 225
description = "Each word overshoots out to 60%, past it once, while blurring away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
