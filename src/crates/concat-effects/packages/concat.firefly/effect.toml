format = 2

[effect]
id = "concat.firefly"
name = "Firefly"
kind = "filter"
category = "Light"
order = 79
intensity = "tone"
description = "Fireflies on a summer night: tiny lights drifting, soft green-gold, almost magic."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "drift"
label = "Drift"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
