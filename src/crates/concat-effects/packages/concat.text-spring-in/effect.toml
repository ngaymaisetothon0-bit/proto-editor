format = 2

[effect]
id = "concat.text-spring-in"
name = "Text Spring In"
kind = "effect"
category = "Motion"
order = 130
description = "The whole title springs into place, growing from 60% with a bounce over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
