format = 2

[effect]
id = "concat.candlelight"
name = "Candlelight"
kind = "filter"
category = "Light"
order = 77
intensity = "tone"
description = "Candlelight in a dark room: warm gold, soft shadows, quiet and close."

[[param]]
key = "tone"
