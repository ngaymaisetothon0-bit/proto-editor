format = 2

[effect]
id = "concat.word-slide-out"
name = "Word Slide Out"
kind = "effect"
category = "Motion"
order = 24
description = "Each word sinks away below and fades out, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
