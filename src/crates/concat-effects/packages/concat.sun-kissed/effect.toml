format = 2

[effect]
id = "concat.sun-kissed"
name = "Sun-Kissed"
kind = "filter"
category = "Portrait"
order = 77
intensity = "tone"
description = "A day in the sun on skin: warm tan, gentle saturation, soft glow."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "tan"
label = "Tan"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
