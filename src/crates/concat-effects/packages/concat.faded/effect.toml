format = 2

[effect]
id = "concat.faded"
name = "Faded"
kind = "filter"
category = "Film"
order = 70
intensity = "tone"
description = "A print left in the sun: blacks lifted, contrast eased, a warm cast."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
