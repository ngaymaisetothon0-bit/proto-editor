format = 2

[effect]
id = "concat.freckle"
name = "Freckle"
kind = "filter"
category = "Portrait"
order = 81
intensity = "tone"
description = "Freckles in the sun: warm skin, honest light, a summer face."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "sun"
label = "Sun"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
