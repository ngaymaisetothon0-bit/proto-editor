format = 2

[effect]
id = "concat.spectrum"
name = "Spectrum"
kind = "filter"
category = "Light"
order = 86
intensity = "tone"
description = "A spectrum of light: faint colours bending, soft and strange, almost magic."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "bend"
label = "Bend"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
