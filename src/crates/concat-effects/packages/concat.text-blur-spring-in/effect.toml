format = 2

[effect]
id = "concat.text-blur-spring-in"
name = "Text Blur Spring In"
kind = "effect"
category = "Motion"
order = 212
description = "The whole title springs in from 60% with a bounce while sharpening out of a soft blur over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
