format = 2

[effect]
id = "concat.cross-process"
name = "Cross Process"
kind = "filter"
category = "Retro"
order = 47
intensity = "tone"
description = "Cross-processed film: punchy contrast, warm highlights, and a yellow-green cast in the blacks."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 75
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 35
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
