format = 2

[effect]
id = "concat.slate"
name = "Slate"
kind = "filter"
category = "Black & White"
order = 80
intensity = "tone"
description = "Cool slate grey: black and white with a blue-grey soul, lifted blacks, quiet and strong."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "lift"
label = "Lift"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
