format = 2

[effect]
id = "concat.zoom-blur-out"
name = "Zoom Blur Out"
kind = "effect"
category = "Motion"
order = 77
description = "The clip shrinks and softens into a blur as it fades out over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
