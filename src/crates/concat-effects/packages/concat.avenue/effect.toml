format = 2

[effect]
id = "concat.avenue"
name = "Avenue"
kind = "filter"
category = "Everyday"
order = 33
intensity = "tone"
description = "Walking down the avenue in the afternoon: plain, bright, easy — an ordinary good day."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "afternoon"
label = "Afternoon"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
