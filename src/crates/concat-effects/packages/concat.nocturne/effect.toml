format = 2

[effect]
id = "concat.nocturne"
name = "Nocturne"
kind = "filter"
category = "Cinematic"
order = 61
intensity = "tone"
description = "A nocturne after dark: deep blue shadows, quiet streets, the city asleep."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "night"
label = "Night"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
