format = 2

[effect]
id = "concat.word-blur-glitch-out"
name = "Word Blur Glitch Out"
kind = "effect"
category = "Motion"
order = 432
description = "Each word glitches away, jittering sideways as it blurs away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
