format = 2

[effect]
id = "concat.text-elastic-out"
name = "Text Elastic Out"
kind = "effect"
category = "Motion"
order = 199
description = "The whole title wobbles elastically away, shrinking to 60% with a rubber-band overshoot, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
