format = 2

[effect]
id = "concat.text-slide-out"
name = "Text Slide Out"
kind = "effect"
category = "Motion"
order = 50
description = "The whole title sinks away below and fades out over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
