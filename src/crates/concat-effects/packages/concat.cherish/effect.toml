format = 2

[effect]
id = "concat.cherish"
name = "Cherish"
kind = "filter"
category = "Portrait"
order = 97
intensity = "tone"
description = "Cherish on a face: warm, soft, dear — a look you hold close."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "warm"
label = "Warm"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
