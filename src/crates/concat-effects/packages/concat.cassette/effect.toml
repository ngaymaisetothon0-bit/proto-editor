format = 2

[effect]
id = "concat.cassette"
name = "Cassette"
kind = "filter"
category = "Retro"
order = 70
intensity = "tone"
description = "An 80s cassette tape: warm, slightly washed out, a little hiss in the colours."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "retro"
label = "Retro"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
