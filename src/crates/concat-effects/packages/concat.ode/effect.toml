format = 2

[effect]
id = "concat.ode"
name = "Ode"
kind = "filter"
category = "Cinematic"
order = 75
intensity = "tone"
description = "An ode on the big screen: warm light, deep shadows, a song of praise."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "praise"
label = "Praise"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
