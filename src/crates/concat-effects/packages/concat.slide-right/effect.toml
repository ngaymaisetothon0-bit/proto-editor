format = 2

[effect]
id = "concat.slide-right"
name = "Slide Right"
kind = "transition"
category = "Slide"
order = 13
description = "The new shot slides in from the right, pushing the old one off the left."

[[param]]
key = "distance"
label = "Distance"
min = 50
max = 150
default = 100
step = 5
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
