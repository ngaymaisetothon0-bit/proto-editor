format = 2

[effect]
id = "concat.glimmer"
name = "Glimmer"
kind = "filter"
category = "Light"
order = 75
intensity = "tone"
description = "Light catching on glass: bright, cool, sparkling at the edges, softly lifted."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "shine"
label = "Shine"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
