format = 2

[effect]
id = "concat.storm"
name = "Storm"
kind = "filter"
category = "Cinematic"
order = 55
intensity = "tone"
description = "A storm rolling in: cool blue shadows, muted colour, heavy contrast like dark weather."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "chill"
label = "Chill"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
