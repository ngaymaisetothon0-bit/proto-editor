format = 2

[effect]
id = "concat.stretch-in"
name = "Stretch In"
kind = "effect"
category = "Motion"
order = 92
description = "The clip stretches in, pulling up from a flat line to full height over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
