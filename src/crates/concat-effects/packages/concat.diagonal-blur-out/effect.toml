format = 2

[effect]
id = "concat.diagonal-blur-out"
name = "Diagonal Blur Out"
kind = "effect"
category = "Motion"
order = 142
description = "The clip slides out diagonally through a blur, softening as it fades over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
