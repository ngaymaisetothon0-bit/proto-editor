format = 2

[effect]
id = "concat.silent-film"
name = "Silent Film"
kind = "filter"
category = "Film"
order = 81
intensity = "tone"
description = "The silent era: warm sepia grey, soft ends, a little age in the blacks."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "age"
label = "Age"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
