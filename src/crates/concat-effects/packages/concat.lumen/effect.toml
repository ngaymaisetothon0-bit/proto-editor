format = 2

[effect]
id = "concat.lumen"
name = "Lumen"
kind = "filter"
category = "Light"
order = 85
intensity = "tone"
description = "A lumen of light in the dark: small, warm, steady — enough to see by."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "steady"
label = "Steady"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
