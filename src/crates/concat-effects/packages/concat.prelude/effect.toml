format = 2

[effect]
id = "concat.prelude"
name = "Prelude"
kind = "filter"
category = "Cinematic"
order = 64
intensity = "tone"
description = "A prelude before the film begins: warm shadows, cool light, the story about to start."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "opening"
label = "Opening"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
