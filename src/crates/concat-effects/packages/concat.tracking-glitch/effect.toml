format = 2

[effect]
id = "concat.tracking-glitch"
name = "Tracking Glitch"
kind = "transition"
category = "Glitch"
order = 22
description = "Worn tape tracking bands shift and glitch as the new shot takes over."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
