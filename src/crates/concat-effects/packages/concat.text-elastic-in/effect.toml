format = 2

[effect]
id = "concat.text-elastic-in"
name = "Text Elastic In"
kind = "effect"
category = "Motion"
order = 198
description = "The whole title wobbles elastically into place, growing from 60% with a rubber-band overshoot, over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
