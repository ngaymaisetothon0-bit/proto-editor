format = 2

[effect]
id = "concat.word-blur-spin-out"
name = "Word Blur Spin Out"
kind = "effect"
category = "Motion"
order = 239
description = "Each word spins out to +90 degrees while blurring away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
