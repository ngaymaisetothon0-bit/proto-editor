format = 2

[effect]
id = "concat.text-blur-bounce-in"
name = "Text Blur Bounce In"
kind = "effect"
category = "Motion"
order = 283
description = "The whole title bounces into place, growing from 60% in a series of smaller bounces, while sharpening out of a soft blur over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
