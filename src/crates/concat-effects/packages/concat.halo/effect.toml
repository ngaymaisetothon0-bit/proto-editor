format = 2

[effect]
id = "concat.halo"
name = "Halo"
kind = "filter"
category = "Light"
order = 73
intensity = "tone"
description = "Soft light all around: lifted blacks, gentle contrast, a bright halo over everything."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "glow"
label = "Glow"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
