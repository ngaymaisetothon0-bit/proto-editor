format = 2

[effect]
id = "concat.daylight"
name = "Daylight"
kind = "filter"
category = "Light"
order = 90
intensity = "tone"
description = "Daylight through the window: bright, warm, clear — morning light."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "morning"
label = "Morning"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
