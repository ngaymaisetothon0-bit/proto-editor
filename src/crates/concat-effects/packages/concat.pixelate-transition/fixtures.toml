# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. The middle pixel's block flips late in the cut - its order is
# 0.786, so it starts turning at 0.786 and is through at 0.936. At 0.85
# it is partway over, at 0.95 it is through.

[[probe]]
name = "default"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.85
expect = [0.50684, 0.36328, 0.33911, 1]

[[probe]]
name = "through"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.95
expect = [0.04999, 0.15002, 0.3999, 1]
