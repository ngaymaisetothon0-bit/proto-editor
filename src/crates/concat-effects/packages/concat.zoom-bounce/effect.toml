format = 2

[effect]
id = "concat.zoom-bounce"
name = "Zoom Bounce"
kind = "transition"
category = "Zoom"
order = 31
description = "The camera zooms and bounces into the new shot."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
