format = 2

[effect]
id = "concat.northern-lights"
name = "Northern Lights"
kind = "filter"
category = "Scenery"
order = 81
intensity = "tone"
description = "Aurora in the sky: green and violet light washing over a dark landscape."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "glow"
label = "Glow"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
