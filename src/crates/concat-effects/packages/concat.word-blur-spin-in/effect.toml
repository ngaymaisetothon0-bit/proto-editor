format = 2

[effect]
id = "concat.word-blur-spin-in"
name = "Word Blur Spin In"
kind = "effect"
category = "Motion"
order = 238
description = "Each word spins in from -90 degrees while sharpening out of a soft blur, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
