format = 2

[effect]
id = "concat.copper-light"
name = "Copper Light"
kind = "filter"
category = "Light"
order = 95
intensity = "tone"
description = "Copper light at dusk: warm, soft, red — the last light of the day."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "dusk"
label = "Dusk"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
