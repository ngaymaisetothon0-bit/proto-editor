format = 2

[effect]
id = "concat.aerochrome"
name = "Aerochrome"
kind = "filter"
category = "Stylised"
order = 56
intensity = "tone"
description = "Infrared false colour: green foliage turns red-orange while the sky stays blue, after Kodak Aerochrome."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
