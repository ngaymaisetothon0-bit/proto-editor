format = 2

[effect]
id = "concat.stroll"
name = "Stroll"
kind = "filter"
category = "Everyday"
order = 30
intensity = "tone"
description = "A slow stroll on a fine day: plain, bright, easy — nothing to prove."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "day"
label = "Day"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
