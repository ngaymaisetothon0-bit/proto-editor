format = 2

[effect]
id = "concat.lane"
name = "Lane"
kind = "filter"
category = "Everyday"
order = 38
intensity = "tone"
description = "A quiet lane in the afternoon: plain, warm, easy — an ordinary good day."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "afternoon"
label = "Afternoon"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
