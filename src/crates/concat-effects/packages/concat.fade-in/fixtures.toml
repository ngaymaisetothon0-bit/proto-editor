# At the clip's first frame the fade has not started, so the middle pixel
# is fully transparent.
#
# Colours in the working space: linear light, 1.0 the white of an SDR
# picture.

[[probe]]
name = "default, transparent at the first frame"
input = [0.8, 0.5, 0.3, 1]
expect = [0, 0, 0, 0]

[[probe]]
name = "shortest duration, still transparent at the first frame"
at = "min"
input = [0.8, 0.5, 0.3, 1]
expect = [0, 0, 0, 0]

[[probe]]
name = "longest duration, still transparent at the first frame"
at = "max"
input = [0.8, 0.5, 0.3, 1]
expect = [0, 0, 0, 0]
