format = 2

[effect]
id = "concat.word-blur-wave-out"
name = "Word Blur Wave Out"
kind = "effect"
category = "Motion"
order = 416
description = "Each word ripples away like a wave travelling across the picture, while blurring away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
