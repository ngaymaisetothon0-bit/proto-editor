format = 2

[effect]
id = "concat.malachite"
name = "Malachite"
kind = "filter"
category = "Color"
order = 57
intensity = "tone"
description = "Malachite stone: deep green, rich and precious, a gem colour."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "gem"
label = "Gem"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
