format = 2

[effect]
id = "concat.slide-right-out"
name = "Slide Right Out"
kind = "transition"
category = "Slide"
order = 21
description = "The old shot slides off to the right, the new one underneath."

[[param]]
key = "distance"
label = "Distance"
min = 50
max = 150
default = 100
step = 5
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
