format = 2

[effect]
id = "concat.word-blur-bounce-out"
name = "Word Blur Bounce Out"
kind = "effect"
category = "Motion"
order = 286
description = "Each word bounces away, shrinking to 60% in a series of smaller bounces, while blurring away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
