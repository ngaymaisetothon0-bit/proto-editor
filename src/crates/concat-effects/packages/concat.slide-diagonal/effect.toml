format = 2

[effect]
id = "concat.slide-diagonal"
name = "Slide Diagonal"
kind = "transition"
category = "Slide"
order = 9
description = "The shots slide past each other on the diagonal, one out top-right, one in bottom-left."

[[param]]
key = "distance"
label = "Distance"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
