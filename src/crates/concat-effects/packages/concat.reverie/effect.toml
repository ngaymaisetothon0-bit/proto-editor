format = 2

[effect]
id = "concat.reverie"
name = "Reverie"
kind = "filter"
category = "Cinematic"
order = 59
intensity = "tone"
description = "A daydream on film: soft, lavender, slightly unreal — a memory half-remembered."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "dream"
label = "Dream"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
