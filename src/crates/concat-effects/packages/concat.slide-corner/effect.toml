format = 2

[effect]
id = "concat.slide-corner"
name = "Slide Corner"
kind = "transition"
category = "Slide"
order = 15
description = "The new shot slides in from the corner, pushing the old one off."

[[param]]
key = "distance"
label = "Distance"
min = 50
max = 150
default = 100
step = 5
unit = "%"

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
