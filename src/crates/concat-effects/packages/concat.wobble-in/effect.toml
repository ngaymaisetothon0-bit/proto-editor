format = 2

[effect]
id = "concat.wobble-in"
name = "Wobble In"
kind = "effect"
category = "Motion"
order = 102
description = "The clip wobbles in, rocking side to side as it grows to full size over the first half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 2.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
