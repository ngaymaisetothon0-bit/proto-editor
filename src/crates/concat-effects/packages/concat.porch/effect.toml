format = 2

[effect]
id = "concat.porch"
name = "Porch"
kind = "filter"
category = "Everyday"
order = 31
intensity = "tone"
description = "Sitting on the porch in the afternoon: plain, warm, unhurried — an ordinary good day."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "afternoon"
label = "Afternoon"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
