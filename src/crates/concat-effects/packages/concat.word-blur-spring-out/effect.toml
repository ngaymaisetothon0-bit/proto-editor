format = 2

[effect]
id = "concat.word-blur-spring-out"
name = "Word Blur Spring Out"
kind = "effect"
category = "Motion"
order = 215
description = "Each word springs out to 60% with a bounce while blurring away, last word first, over its last half-second."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 0.5
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
