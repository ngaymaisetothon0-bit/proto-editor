format = 2

[effect]
id = "concat.word-blur-pop-in"
name = "Word Blur Pop In"
kind = "effect"
category = "Motion"
order = 190
description = "Each word pops in from 60% while sharpening out of a soft blur, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
