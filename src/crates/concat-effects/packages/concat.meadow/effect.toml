format = 2

[effect]
id = "concat.meadow"
name = "Meadow"
kind = "filter"
category = "Everyday"
order = 20
intensity = "tone"
description = "A fresh morning in the meadow: soft greens, bright light, easy on the eyes."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 65
step = 1
unit = "%"

[[param]]
key = "fresh"
label = "Fresh"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
