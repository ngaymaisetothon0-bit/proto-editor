format = 2

[effect]
id = "concat.word-blur-roll-in"
name = "Word Blur Roll In"
kind = "effect"
category = "Motion"
order = 429
description = "Each word rolls into place, turning once as it glides to the centre, while sharpening out of a soft blur, one after another."

[[param]]
key = "duration"
label = "Duration"
min = 0.1
max = 3.0
default = 1.0
step = 0.1
unit = "s"

[wgsl]
entry = "effect.wgsl"
